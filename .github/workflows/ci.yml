name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Install dependencies
      run: cd core-processor && go mod download
    - name: Run tests
      run: cd core-processor && go test ./... -v
    - name: Build
      run: cd core-processor && go build -o course-processor .

  test-creator-app:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: creator-app/package-lock.json
    - name: Install dependencies
      run: cd creator-app && npm ci
    - name: Lint
      run: cd creator-app && npm run lint
    - name: Run tests
      run: cd creator-app && npm test -- --coverage --watchAll=false
    - name: Build
      run: cd creator-app && npm run build

  test-mobile-player:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: mobile-player/package-lock.json
    - name: Install dependencies
      run: cd mobile-player && npm ci
    - name: Lint
      run: cd mobile-player && npm run lint
    - name: Run tests
      run: cd mobile-player && npm test -- --coverage --watchAll=false

  test-player-app:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: player-app/package-lock.json
    - name: Install dependencies
      run: cd player-app && npm ci
    - name: Lint
      run: cd player-app && npm run lint
    - name: Build
      run: cd player-app && npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-creator-app, test-mobile-player, test-player-app]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build core-processor
      uses: docker/build-push-action@v5
      with:
        context: ./core-processor
        push: false
        tags: course-creator/core-processor:latest
    - name: Build creator-app
      uses: docker/build-push-action@v5
      with:
        context: ./creator-app
        push: false
        tags: course-creator/creator-app:latest
    - name: Build player-app
      uses: docker/build-push-action@v5
      with:
        context: ./player-app
        push: false
        tags: course-creator/player-app:latest